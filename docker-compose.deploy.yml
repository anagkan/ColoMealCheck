# For running the kiosk from the published image instead of building it.
#
#   cp .env.example .env     # then fill in SECRET_KEY
#   docker compose -f docker-compose.deploy.yml up -d
#
# Identical to docker-compose.yml except that `api` pulls a tagged image rather
# than building from this directory, so it works on a machine that has no copy
# of the source. It reads the same .env, so the two files stay interchangeable.
#
# The image is private. Pulling it needs a GitHub token with read:packages:
#
#   docker login ghcr.io -u <your-github-username>
#
# The tag is pinned rather than :latest. Someone testing a specific version
# should keep getting that version when they restart, and not be moved onto
# whatever was pushed in the meantime without being told.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colonial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-colonial}
      POSTGRES_DB: ${POSTGRES_DB:-colomealcheck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colonial} -d ${POSTGRES_DB:-colomealcheck}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/anagkan/colomealcheck:0.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-colonial}:${POSTGRES_PASSWORD:-colonial}@db:5432/${POSTGRES_DB:-colomealcheck}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      TIMEZONE: ${TIMEZONE:-America/New_York}
      PHOTO_DIR: /srv/data/photos
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      # Left blank, the first boot generates one and prints it to
      # `docker compose logs api`. It is shown once.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      STAFF_PIN: ${STAFF_PIN:-1234}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - photos:/srv/data/photos

volumes:
  pgdata:
  photos:
